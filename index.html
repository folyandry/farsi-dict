<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1830">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Персидский словарь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Onest:wght@400;500;600&family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #0f1830; --bg2: #15203c; --raise: #1d2a4c; --line: #2b3b62;
    --text: #efe8d6; --mute: #a1abc6; --faint: #7b87a8;
    --accent: #e3b155; --accent-ink: #1b1405; --danger: #e58a7d;
    --serif: Literata, Georgia, "Times New Roman", serif;
    --fa: Vazirmatn, "Noto Naskh Arabic", Tahoma, "Geeza Pro", serif;
    --sans: Onest, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); color-scheme: dark; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.5 var(--sans); -webkit-text-size-adjust: 100%; overflow-x: hidden; }
  button, label, input, textarea { touch-action: manipulation; }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }

  .head { padding: 22px 0 6px; }
  h1 { margin: 0; font: 600 26px/1.15 var(--serif); letter-spacing: -0.01em; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--mute); font-size: 14px; gap: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; flex: none; }
  .seg button { font-size: 13px; color: var(--mute); background: none; border: 0; padding: 3px 12px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); }

  .toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 10px 0 8px; }
  .search { display: flex; align-items: center; gap: 10px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; color: var(--mute); }
  .search:focus-within { border-color: var(--accent); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font: inherit; font-size: 16px; padding: 12px 0; }
  .search input::placeholder { color: var(--faint); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .fchip { flex: none; font-size: 14px; padding: 6px 12px; border-radius: 999px; cursor: pointer; color: hsl(var(--h) 60% 80%); background: hsl(var(--h) 45% 55% / .12); border: 1px solid hsl(var(--h) 45% 60% / .3); }
  .fchip .n { margin-left: 6px; opacity: .6; font-size: 12px; }
  .fchip.on { background: hsl(var(--h) 60% 72%); color: #0f1830; border-color: transparent; }
  .fchip.on .n { opacity: .7; }

  #list { padding-bottom: 120px; }
  .row { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 2px; cursor: pointer; content-visibility: auto; contain-intrinsic-size: auto 84px; }
  .row:active { background: var(--bg2); }
  @media (hover: hover) { .row:hover { background: var(--bg2); } }
  .rowmain { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .rt { min-width: 0; }
  .fa { flex: none; max-width: 48%; direction: rtl; text-align: right; font: 600 28px/1.5 var(--fa); overflow-wrap: anywhere; }
  .rt .tr { display: block; font: 600 21px/1.3 var(--serif); overflow-wrap: anywhere; }
  .rt .mean { display: block; margin-top: 2px; color: var(--mute); overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { display: inline-block; font-size: 12px; line-height: 1.5; padding: 1px 9px; border-radius: 999px; color: hsl(var(--h) 60% 78%); background: hsl(var(--h) 45% 55% / .16); border: 1px solid hsl(var(--h) 45% 60% / .3); }
  button.tag { font-size: 13px; padding: 2px 11px; cursor: pointer; }
  .note { color: var(--mute); padding: 28px 0; margin: 0; }
  .empty { padding: 48px 0 0; }
  .empty h2 { margin: 0 0 8px; font: 600 22px/1.25 var(--serif); }
  .empty p { margin: 0 0 20px; color: var(--mute); max-width: 34ch; }
  .foot { padding: 0 0 130px; margin-top: -90px; display: flex; flex-wrap: wrap; gap: 4px 20px; }
  .linkbtn { background: none; border: 0; color: var(--mute); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 0; }

  .fabwrap { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 10; pointer-events: none; display: flex; justify-content: center; }
  .fabin { width: 100%; max-width: 640px; padding: 0 20px; display: flex; justify-content: flex-end; }
  .fab { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; padding: 14px 20px 14px 16px; border-radius: 999px; box-shadow: 0 6px 24px rgba(4, 8, 20, .55); }

  .btn { font-weight: 500; font-size: 16px; border-radius: 12px; padding: 12px 18px; cursor: pointer; border: 1px solid transparent; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.ghost { background: none; border-color: var(--line); color: var(--text); }
  .btn.danger { background: var(--danger); color: #2a0d09; font-weight: 600; }
  .btn:disabled { opacity: .55; cursor: default; }
  .tbtn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; font-size: 15px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
  .tbtn:active, .ibtn:active { background: var(--bg2); }
  .ibtn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; background: none; border: 0; border-radius: 10px; cursor: pointer; }
  .ic { display: inline-flex; }

  .sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .sheet.form { z-index: 30; }
  .sheet.enter { animation: slide .2s ease-out; will-change: transform, opacity; }
  @keyframes slide { from { transform: translate3d(28px, 0, 0); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet.enter { animation: none; } }
  .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: calc(env(safe-area-inset-top, 0px) + 8px) 0 8px; display: flex; align-items: center; gap: 4px; }
  .bar .sp { flex: 1; }
  .bar .ttl { flex: 1; text-align: center; font-weight: 600; }
  .bar .side { min-width: 84px; }

  .dfa { margin: 14px 0 0; direction: rtl; text-align: right; font: 600 clamp(40px, 13vw, 60px)/1.5 var(--fa); overflow-wrap: anywhere; }
  .dfa + .dtr { margin-top: 0; }
  .dtr { margin: 18px 0 4px; font: 600 clamp(36px, 11vw, 52px)/1.08 var(--serif); letter-spacing: -0.015em; overflow-wrap: anywhere; }
  .dmean { margin: 0 0 14px; font-size: 22px; line-height: 1.35; overflow-wrap: anywhere; }
  .sec { margin-top: 26px; }
  .sec h3 { margin: 0 0 8px; font-size: 14px; font-weight: 500; color: var(--mute); }
  .wchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .wchip { font-size: 15px; padding: 6px 12px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); color: var(--text); }
  button.wchip.link { cursor: pointer; border-color: rgba(227, 177, 85, .5); }
  .wchip small { color: var(--mute); margin-left: 6px; font-size: 13px; }
  .ex { margin: 0; padding: 2px 0 2px 14px; border-left: 2px solid var(--accent); }
  .extr { margin: 0; font: italic 400 19px/1.45 var(--serif); overflow-wrap: anywhere; }
  .exm { margin: 4px 0 0; color: var(--mute); }
  .txt { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .hintline { margin-top: 30px; color: var(--mute); }
  .when { margin: 34px 0 0; padding-bottom: 56px; color: var(--faint); font-size: 13px; }

  .fbody { padding-top: 10px; padding-bottom: 24px; }
  .field { margin: 0 0 20px; }
  .field > label { display: block; font-size: 14px; color: var(--mute); margin: 0 0 6px; }
  .field > label.btn { display: inline-block; color: var(--text); font-size: 16px; margin: 0; }
  .field input, .field textarea { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font: inherit; font-size: 16px; padding: 12px 14px; }
  .field textarea { resize: vertical; min-height: 96px; }
  .field input.big { font: 600 20px var(--serif); }
  .field input.fa-in { direction: rtl; text-align: right; font: 600 24px var(--fa); }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .hint { font-size: 13px; color: var(--faint); margin: 6px 0 0; }
  .hint.warn { color: var(--accent); }
  .err { font-size: 13px; color: var(--danger); margin: 6px 0 0; }
  .err:empty { display: none; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick { font-size: 14px; padding: 6px 12px; border-radius: 999px; cursor: pointer; color: hsl(var(--h) 60% 80%); background: hsl(var(--h) 45% 55% / .12); border: 1px solid hsl(var(--h) 45% 60% / .3); }
  .pick.on { background: hsl(var(--h) 60% 72%); color: #0f1830; border-color: transparent; }
  .addtag { display: flex; gap: 8px; margin-top: 10px; }
  .addtag input { flex: 1; min-width: 0; }
  .addtag .btn { padding: 10px 14px; font-size: 15px; }
  .actions { position: sticky; bottom: 0; z-index: 2; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 10px; }
  .actions .btn { flex: 1 1 auto; }

  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(5, 9, 20, .66); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .dialog { width: 100%; max-width: 340px; background: var(--raise); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .dialog .dt { margin: 0 0 6px; font: 600 19px/1.3 var(--serif); overflow-wrap: anywhere; }
  .dialog .dd { margin: 0 0 18px; color: var(--mute); }
  .dact { display: flex; gap: 10px; justify-content: flex-end; }
  #toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translateX(-50%); max-width: calc(100% - 40px); background: var(--raise); border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .18s; }
  #toast.show { opacity: 1; }

  /* ---------- smooth scrolling on high-refresh screens ---------- */
  html { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
  button, label, .row { touch-action: manipulation; }
  .row { content-visibility: auto; contain-intrinsic-size: auto 92px; }
  .fab { transform: translateZ(0); }
  .sheet { contain: layout paint; }
  .sheet.enter { animation-duration: .18s; }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>Персидский словарь</h1>
    <div class="meta">
      <span id="count"></span>
      <div class="seg" role="group" aria-label="Сортировка">
        <button type="button" id="sortNew">Новые</button>
        <button type="button" id="sortAz">A–Z</button>
      </div>
    </div>
  </header>
  <div class="toolbar">
    <label class="search">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span>
      <input id="q" type="search" placeholder="Поиск по слову, переводу, тегу" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Поиск">
    </label>
    <div class="chips" id="filters" hidden></div>
  </div>
  <main id="list"></main>
  <div class="foot" id="foot"></div>
</div>

<div class="fabwrap"><div class="fabin">
  <button type="button" class="fab" id="add">
    <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    Добавить слово
  </button>
</div></div>

<div id="detailRoot"></div>
<div id="formRoot"></div>
<div id="dialogRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

      if (downloadsApi) await downloadsApi.save({ filename: 'persian-dictionary.csv', data: data });
      else {
        var url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
        var a = document.createElement('a'); a.href = url; a.download = 'persian-dictionary.csv';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }
    } catch (e) { if (!e || e.code !== 'declined') toast('Не удалось сохранить файл.'); }
  }

  /* ---------- wiring ---------- */
  var searchFrame = 0;
  $('#q').addEventListener('input', function (e) {
    ui.q = e.target.value;
    if (!searchFrame) searchFrame = requestAnimationFrame(function () { searchFrame = 0; renderList(); });
  });
  $('#list').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.row') : null;
    if (b) openDetail(b.getAttribute('data-id'));
  });
  $('#sortNew').addEventListener('click', function () { ui.sort = 'new'; lsSet(LS_SORT, 'new'); renderList(); });
  $('#sortAz').addEventListener('click', function () { ui.sort = 'az'; lsSet(LS_SORT, 'az'); renderList(); });
  $('#add').addEventListener('click', function () { openForm(null); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var top = layers[layers.length - 1];
    if (top) popLayer(top.name);
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  stored = loadLocal();
  recompute();
  ready = true;
  render();
  initCapabilities();
})();

</script>
</body>
</html>
